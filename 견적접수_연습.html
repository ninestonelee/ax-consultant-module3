<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>견적 접수 연습</title><style>*{box-sizing:border-box}body{font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;background:#edf1f6;color:#001536;margin:0;word-break:keep-all}main{max-width:990px;margin:auto;padding:24px}nav{display:flex;gap:10px;align-items:center;margin-bottom:16px}select,button,input,textarea{font:inherit}select,button{padding:8px 12px}article{background:white;border-radius:16px;padding:30px 36px}small{font-weight:bold;color:#0054bf}h1{font-size:30px;margin:10px 0}p,li{font-size:18px;line-height:1.5}ol{padding-left:24px}fieldset{border:1px solid #bbc9db;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}legend{font-weight:700}label{font-weight:650}textarea{display:block;width:100%;font-size:17px;line-height:1.4;padding:8px;margin-top:5px;border:1px solid #73849b;border-radius:4px;height:66px}button{cursor:pointer}button.primary{background:#0054bf;border:0;color:white;border-radius:6px}output{display:block;margin-top:10px;color:#004a9d;min-height:20px}.hint{border-left:4px solid #ff5e00;padding-left:12px} article{margin-bottom:14px}fieldset{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}input{max-width:100%;width:100%;padding:8px;border:1px solid #748599;border-radius:5px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #c0cad6;padding:8px}h2{font-size:21px}output{font-weight:bold}#msg{border-left:4px solid #0066ff;padding-left:12px} @media(max-width:550px){main{padding:8px}article{padding:15px}td,th{padding:4px;font-size:14px}}</style><main><article><small>가상 견적 · 오프라인 실습</small><h1>견적 요청을 접수합니다</h1><p>수량과 단가를 입력하고 금액을 확인하세요. 같은 접수 번호는 한 번만 기록합니다.</p><form novalidate><fieldset><legend>요청 내용</legend><label>접수 번호<input id="ref" value="TEST-001"></label><label>품목<input id="item" value="가공 부품 A"></label><label>수량(개)<input id="qty" type="number" min="1" step="1" value="3"></label><label>단가(원)<input id="price" type="number" min="1" step="1" value="20000"></label></fieldset><p id="estimate"></p><button class="primary">접수하기</button></form><output id="msg" aria-live="polite">접수 전입니다.</output></article><article><h2>접수 기록</h2><table><thead><tr><th>번호</th><th>품목</th><th>금액</th><th>상태</th></tr></thead><tbody></tbody></table><h2>담당자 알림 연습</h2><p id="alert">접수하면 같은 번호가 여기에 표시됩니다.</p><small>이 파일은 브라우저 안에서만 연습합니다. 새로 열면 기록이 비워집니다. 실제 시트와 메일 연결은 S08 실습에서 확인하세요.</small></article></main><script>const get=id=>document.getElementById(id);const fields=['ref','item','qty','price'].map(get);const ids=new Set();const price=()=>Number(fields[2].value)*Number(fields[3].value);const money=n=>n.toLocaleString('ko-KR')+'원';function calc(){get('estimate').textContent='예상 금액　'+money(price())}fields.forEach(f=>f.oninput=calc);calc();document.querySelector('form').onsubmit=e=>{e.preventDefault();const [ref,item,q,p]=fields.map(f=>f.value.trim());const msg=get('msg');if(!ref||!item||![Number(q),Number(p)].every(n=>Number.isSafeInteger(n)&&n>0)){msg.textContent='입력값을 확인하세요. 번호와 품목을 쓰고 수량·단가에는 양의 정수를 넣으세요.';return}if(ids.has(ref)){msg.textContent=ref+'은 이미 접수했습니다. 기록은 한 줄입니다.';return}ids.add(ref);const tr=document.querySelector('tbody').insertRow();[ref,item,money(price()),'담당자 확인 대기'].forEach(v=>tr.insertCell().textContent=v);msg.textContent=ref+' 접수 완료';get('alert').textContent=ref+' · '+item+' · '+money(price())+'　금액을 확인해 주세요.'}</script></html>
